<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f09819"/>
      <stop offset="100%" stop-color="#e8821e"/>
    </linearGradient>
  </defs>
  <!-- Фон: круг с градиентом -->
  <circle cx="24" cy="24" r="24" fill="url(#g)"/>
  <!-- Мягкая тень-обводка -->
  <circle cx="24" cy="24" r="22.5" fill="none" stroke="#d06b12" stroke-width="1" opacity="0.4"/>
  <!-- Буква «С» — жирная, читаемая даже на 16px -->
  <text x="24" y="33" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="30" fill="white" letter-spacing="-1">С</text>
</svg>
